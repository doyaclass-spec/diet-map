<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 식사 기록 🍽️</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg:#FEFCF8;--surface:#FFFFFF;--surface2:#F7F2EA;--border:#EDE3CE;
  --text:#1C1410;--text2:#5C4A30;--text3:#8A7560;
  --gold:#B8934A;--gold2:#D4A85C;--gold-light:#F5EDD6;--today-bg:#FFFBF0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Serif KR',Georgia,serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* LOGIN */
.login-overlay{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#1A0F08 0%,#2C1A0A 50%,#1A0F08 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;padding:40px 32px;}
.login-overlay.hidden{display:none;}
.login-icon{font-size:52px;filter:drop-shadow(0 4px 12px rgba(184,147,74,0.5));}
.login-logo{font-family:'DM Serif Display',serif;font-size:40px;color:#F5EDD6;text-align:center;letter-spacing:1px;text-shadow:0 2px 20px rgba(184,147,74,0.3);}
.login-year{font-size:13px;color:#B8934A;letter-spacing:6px;text-transform:uppercase;}
.login-divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,#B8934A,transparent);}
.login-btn{width:100%;max-width:300px;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#1C1410;padding:16px 28px;border:none;border-radius:14px;font-size:16px;font-family:'Noto Serif KR',serif;font-weight:700;cursor:pointer;box-shadow:0 8px 32px rgba(0,0,0,0.4);transition:transform .15s,box-shadow .15s;}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,0.5);}
.login-btn:active{transform:translateY(0);}
.login-btn img{width:22px;height:22px;}

/* HEADER */
header{background:#1C1410;color:var(--gold-light);padding:20px 24px;position:sticky;top:0;z-index:100;box-shadow:0 4px 24px rgba(0,0,0,.35);}
.header-inner{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.header-label{font-size:10px;letter-spacing:4px;color:var(--gold);margin-bottom:4px;text-transform:uppercase;}
.header-title{font-family:'DM Serif Display',serif;font-size:24px;font-weight:400;}
.header-subtitle{font-size:11px;color:#8A7560;margin-top:2px;}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.streak-badge{background:linear-gradient(135deg,#FF6B35,#FF4500);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(255,107,53,.4);white-space:nowrap;}
.streak-badge.zero{background:#2C1F10;color:#8A7560;box-shadow:none;}
.fasting-badge{background:#1A2840;color:#60A0D0;padding:8px 14px;border-radius:20px;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid #2A4060;}
.fasting-badge .fasting-time{font-family:'DM Serif Display',serif;font-size:16px;font-weight:700;color:#80C0F0;}
.header-stat{text-align:right;}
.stat-count{font-family:'DM Serif Display',serif;font-size:30px;color:var(--gold);line-height:1;}
.stat-label{font-size:10px;color:#8A7560;letter-spacing:1px;margin-top:2px;}
.progress-bar{margin-top:5px;height:3px;width:100px;background:#2C1F10;border-radius:2px;overflow:hidden;margin-left:auto;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;transition:width .6s ease;}
.user-btn{display:flex;align-items:center;gap:6px;background:#2C1F10;border:1px solid #4A3010;padding:6px 12px;border-radius:20px;cursor:pointer;transition:background .15s;}
.user-btn:hover{background:#3C2A14;}
.user-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;}
.user-name{font-size:11px;color:var(--gold-light);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.logout-text{font-size:10px;color:#6A5A40;}

/* LEGEND */
.legend{background:var(--gold-light);border-bottom:1px solid var(--border);}
.legend-inner{max-width:980px;margin:0 auto;padding:7px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);}

/* WEIGHT PANEL */
.weight-panel{max-width:980px;margin:24px auto 0;padding:0 16px;}
.weight-panel-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.weight-panel-header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.weight-panel-title{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;}
.weight-panel-meta{font-size:11px;color:var(--text3);}
.weight-panel-toggle{font-size:12px;color:var(--text3);transition:transform .2s;}
.weight-panel-toggle.open{transform:rotate(180deg);}
.weight-panel-body{padding:0 20px 20px;}
canvas#weightChart{width:100%;height:200px;display:block;border-radius:10px;}
.goal-box{display:flex;align-items:center;background:linear-gradient(135deg,#1A2F1A,#1E3820);border:1px solid #2A5030;border-radius:12px;padding:12px 16px;margin-bottom:14px;gap:14px;flex-wrap:wrap;}
.goal-item{display:flex;flex-direction:column;gap:2px;}
.goal-item-label{font-size:12px;color:#90C490;letter-spacing:.5px;font-weight:600;}
.goal-item-value{font-family:'DM Serif Display',serif;font-size:24px;color:#fff;line-height:1;}
.goal-item-unit{font-size:13px;color:#A8D4A8;margin-left:2px;}
.goal-divider{width:1px;height:40px;background:#3A6040;flex-shrink:0;}
.goal-remaining{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px;}
.goal-remaining-label{font-size:12px;color:#90C490;font-weight:600;}
.goal-remaining-bar-wrap{height:8px;background:#1A3020;border-radius:4px;overflow:hidden;width:100%;}
.goal-remaining-bar{height:100%;border-radius:4px;transition:width .6s ease;background:linear-gradient(90deg,#2ECC71,#27AE60);}
.goal-remaining-value{font-size:15px;font-weight:700;color:#6EE88A;}
.goal-reached{font-size:15px;font-weight:700;color:#FFD700;}

/* MAIN */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;gap:14px;}
/* 접힌 상태: 헤더 + 작은 펼치기 버튼만 표시 */
.day-card.collapsed .meal-grid,
.day-card.collapsed .day-footer,
.day-card.collapsed .finish-row { display:none; }
.day-card.collapsed .day-header { margin-bottom:0; }
.day-card.collapsed .collapse-hint { display:flex !important; }
.collapse-hint { display:none; justify-content:flex-end; margin-top:6px; }
.collapse-hint-btn { font-size:11px; color:var(--gold); background:none; border:1px solid var(--gold); border-radius:6px; padding:3px 10px; cursor:pointer; }
/* finish-row: 펼쳐진 상태에서만 표시 */
.finish-row { margin-top:10px; display:flex; gap:8px; align-items:center; }
.finish-btn { flex:1; padding:10px; border:none; background:linear-gradient(135deg,#B8934A,#D4A85C); color:#fff; font-family:inherit; font-size:14px; font-weight:700; border-radius:10px; cursor:pointer; transition:opacity .2s; box-shadow:0 2px 8px rgba(184,147,74,.3); letter-spacing:0.5px; }
.finish-btn:hover { opacity:.85; }
.edit-btn { padding:10px 14px; border:1px solid var(--border); background:transparent; color:var(--text2); font-family:'Noto Serif KR',serif; font-size:12px; border-radius:10px; cursor:pointer; white-space:nowrap; }
.edit-btn:hover { border-color:var(--gold); color:var(--gold); }
.done-badge { display:none; font-size:12px; color:var(--gold); font-weight:600; flex:1; }
.day-card.done .finish-btn { display:none; }
.day-card.done .done-badge { display:flex; align-items:center; gap:4px; }

/* ── 애니메이션 키프레임 ── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;max-height:0;transform:translateY(-8px)}to{opacity:1;max-height:2000px;transform:translateY(0)}}
@keyframes slideUp{from{opacity:1;max-height:2000px}to{opacity:0;max-height:0}}
@keyframes popIn{0%{transform:scale(0.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes checkPop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* 카드 등장 */
.day-card{animation:fadeInUp .35s ease both;}
.day-card:nth-child(1){animation-delay:.05s}
.day-card:nth-child(2){animation-delay:.10s}
.day-card:nth-child(3){animation-delay:.15s}
.day-card:nth-child(4){animation-delay:.20s}
.day-card:nth-child(5){animation-delay:.25s}

/* 카드 펼치기/접기 */
/* meal-grid animation removed */
.day-footer{animation:fadeIn .25s ease both;}
.finish-row{animation:fadeIn .2s ease both;}

/* 사진 업로드 완료 */
.photo-slot img{animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}

/* 완료 버튼 누를 때 */
.finish-btn:active{transform:scale(0.97);}

/* 토스트 */
.toast{animation:fadeInUp .3s ease both;}

/* 헤더 stat */
.stat-count{animation:fadeInUp .4s ease both;}
.streak-badge{animation:fadeInUp .3s ease both;}

/* 업로딩 shimmer */
.uploading-slot{background:linear-gradient(90deg,#f0e8d8 25%,#f8f0e0 50%,#f0e8d8 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}

/* 로그인 화면 등장 */
.login-icon{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) .1s both;}
.login-logo{animation:fadeInUp .4s ease .2s both;}
.login-year{animation:fadeInUp .4s ease .3s both;}
.login-divider{animation:fadeIn .4s ease .35s both;}
.login-btn{animation:fadeInUp .4s ease .4s both;}

/* 체중 그래프 */
canvas{animation:fadeIn .5s ease both;}

.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
.loading-text{font-size:14px;color:var(--text3);}
main{max-width:980px;margin:0 auto;padding:24px 16px 80px;}
.month-section{margin-bottom:48px;}
.month-header{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
.month-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text);font-weight:400;white-space:nowrap;}
.month-line{flex:1;height:1px;background:var(--border);}
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);transition:box-shadow .2s, border-color .2s, transform .15s;}
.day-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);}
.day-card.today{transform-origin:top;}
.day-card.today{background:var(--today-bg);border:2px solid var(--gold);box-shadow:0 4px 20px rgba(184,147,74,.15);}
.day-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.day-badge{width:38px;height:38px;background:var(--surface2);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.day-card.today .day-badge{background:var(--gold);}
.day-dow{font-size:15px;font-weight:700;color:var(--text2);}
.day-card.today .day-dow{color:#fff;}
.day-info{flex:1;}
.day-info-title{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.today-badge{font-size:11px;background:var(--gold);color:#fff;padding:2px 8px;border-radius:20px;}
.day-status{font-size:12px;color:var(--gold);margin-top:2px;}
.meal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.meal-col-inner{display:flex;flex-direction:column;}
.meal-label{font-size:12px;color:var(--text2);margin-bottom:4px;display:flex;align-items:center;gap:4px;font-weight:600;}

/* TIME PICKER */
.meal-time-row{display:flex;align-items:center;gap:4px;margin-bottom:5px;position:relative;}
.meal-time-btn{flex:1;padding:4px 7px;font-size:11px;font-family:'Noto Serif KR',serif;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text2);cursor:pointer;text-align:left;transition:border-color .2s;display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden;}
.meal-time-btn:hover{border-color:var(--gold);background:#FFFDF7;}
.meal-time-btn.has-time{color:var(--text);font-weight:600;}
.meal-time-btn-icon{font-size:10px;flex-shrink:0;}
.meal-time-clear{flex-shrink:0;width:16px;height:16px;border:none;background:none;color:#C8B898;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;padding:0;line-height:1;transition:color .15s;}
.meal-time-clear:hover{color:#e05050;}
.time-picker-popup{position:absolute;top:calc(100% + 4px);left:0;z-index:500;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:10px;width:200px;animation:popIn .15s ease;}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.tp-ampm{display:flex;gap:4px;margin-bottom:8px;}
.tp-ampm-btn{flex:1;padding:5px 0;font-size:12px;font-weight:700;font-family:'Noto Serif KR',serif;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text3);cursor:pointer;transition:all .15s;}
.tp-ampm-btn.active{background:var(--gold);color:#fff;border-color:var(--gold);}
.tp-section-label{font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:600;letter-spacing:.5px;}
.tp-grid{display:grid;gap:3px;margin-bottom:6px;}
.tp-grid.hours{grid-template-columns:repeat(4,1fr);}
.tp-grid.minutes{grid-template-columns:repeat(4,1fr);}
.tp-cell{padding:5px 0;font-size:11px;text-align:center;font-family:'DM Serif Display',serif;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .12s;}
.tp-cell:hover{background:var(--gold-light);border-color:var(--gold);color:var(--gold);}
.tp-cell.active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700;}

/* PHOTO SLOTS */
.photo-slot{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;transition:transform .2s;}
.photo-slot:hover{transform:scale(1.03);}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s;}
.photo-slot:hover img{transform:scale(1.05);}
.photo-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .2s;display:flex;align-items:center;justify-content:center;}
.photo-slot:hover .photo-overlay{background:rgba(0,0,0,.28);}
.photo-overlay-icon{font-size:20px;opacity:0;transition:opacity .2s,transform .2s;transform:scale(.8);}
.photo-slot:hover .photo-overlay-icon{opacity:1;transform:scale(1);}
.empty-slot{aspect-ratio:1;border-radius:10px;border:2px dashed;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#FAFAF7;transition:all .2s;gap:3px;}
.empty-slot:hover{transform:scale(1.01);}
.empty-slot .plus{font-size:20px;transition:transform .2s;}
.empty-slot:hover .plus{transform:scale(1.2);}
.empty-slot .add-text{font-size:9px;color:#B8A88A;text-align:center;line-height:1.3;}
.uploading-slot{aspect-ratio:1;border-radius:10px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* FOOD NOTES */
.food-notes{margin-top:6px;display:flex;flex-direction:column;gap:3px;}
.food-note-row{display:flex;align-items:center;gap:3px;}
.food-note-input{flex:1;padding:5px 8px;font-size:12px;font-family:'Noto Serif KR',serif;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:6px;outline:none;transition:border-color .2s;min-width:0;}
.food-note-input:focus{border-color:var(--gold);background:#FFFDF7;}
.food-note-input::placeholder{color:#B0A080;font-size:11px;}
.food-note-del{flex-shrink:0;width:18px;height:18px;border:none;background:none;color:#C0A880;font-size:16px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:color .15s,background .15s;padding:0;line-height:1;}
.food-note-del:hover{color:#e05050;background:#FFF0F0;}
.food-add-btn{margin-top:3px;width:100%;padding:5px 0;font-size:11px;font-family:'Noto Serif KR',serif;color:var(--text2);background:none;border:1px dashed var(--border);border-radius:6px;cursor:pointer;transition:all .15s;}
.food-add-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-light);}
.food-limit-msg{font-size:11px;color:#A09070;text-align:center;padding:3px 0;}

/* DAY FOOTER */
.day-footer{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.footer-block{display:flex;flex-direction:column;gap:4px;}
.footer-label{font-size:12px;color:var(--text2);font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:4px;}
.footer-input-row{display:flex;align-items:center;gap:6px;}
.footer-input{padding:6px 10px;font-size:13px;font-family:'Noto Serif KR',serif;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);outline:none;transition:border-color .2s;}
.footer-input:focus{border-color:var(--gold);background:#FFFDF7;}
.footer-input.w-weight{width:80px;}
.footer-input.w-exercise-type{width:130px;}
.footer-input.w-exercise-dur{width:60px;}
.footer-unit{font-size:12px;color:var(--text2);font-weight:600;}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;align-items:center;justify-content:center;flex-direction:column;padding:24px;cursor:zoom-out;}
.lightbox.open{display:flex;}
.lightbox-meta{color:var(--gold-light);margin-bottom:16px;font-size:14px;letter-spacing:1px;display:flex;gap:8px;align-items:center;}
.lightbox img{max-width:90vw;max-height:80vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);object-fit:contain;}
.lightbox-close{color:#8A7560;margin-top:16px;font-size:12px;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:#1C1410;color:var(--gold-light);padding:10px 22px;border-radius:30px;font-size:13px;z-index:8888;transition:transform .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

@media(max-width:640px){
  .header-title{font-size:19px;}.stat-count{font-size:24px;}
  .meal-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
  .meal-col-inner{min-width:0;overflow:hidden;}
  .meal-label{font-size:10px;}
  .meal-time-btn{font-size:10px;padding:3px 5px;}
  .food-note-input{font-size:11px;}
  .food-add-btn{font-size:10px;}
  .day-card{padding:10px 12px;}
  .fasting-badge,.streak-badge{font-size:11px;padding:6px 10px;}
  .user-btn{position:fixed;top:10px;right:12px;z-index:9999;padding:5px 10px;}
  .logout-text{display:none;}
  .user-name{display:none;}
  .user-avatar{width:24px;height:24px;}
  .footer-input.w-exercise-type{width:100px;}.day-footer{gap:8px;}
}
</style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-icon">🍽️</div>
  <div class="login-logo">나의 식사 기록</div>
  <div class="login-year">2025 Diet Journal</div>
  <div class="login-divider"></div>
  <button class="login-btn" onclick="signInWithGoogle()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Google 계정으로 로그인
  </button>
</div>

<header>
  <div class="header-inner">
    <div class="header-left">
      <div class="header-label">Daily Meal Journal · 2025</div>

// ── 상수 & 전역 ──
const GOAL_WEIGHT = 75;
const MEALS = [
  { key:'breakfast', label:'아침', emoji:'🌅', color:'#F59E0B' },
  { key:'lunch',     label:'점심', emoji:'☀️', color:'#10B981' },
  { key:'dinner',    label:'저녁', emoji:'🌙', color:'#6366F1' },
];
const DOW = ['일','월','화','수','목','금','토'];
const MAX_NOTES = 5;
const MIN_NOTES = 1;
let photoCache={}, notesCache={}, timesCache={}, weightsCache={}, exerciseCache={};
let currentUpload=null, fastingInterval=null, weightPanelOpen=true, activePickerClose=null;

function nowKST() {
  const utc = Date.now() + (new Date().getTimezoneOffset()*60000);
  return new Date(utc + 9*3600000);
}
function getDates() {
  const dates=[], end=new Date(2025,3,30);
  for(let d=new Date(2025,1,27);d<=end;d.setDate(d.getDate()+1)) dates.push(new Date(d));
  return dates;
}
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function photoKey(d,m) { return `${dateKey(d)}:${m}`; }
function noteKey(d,m)  { return `note:${dateKey(d)}:${m}`; }
function timeKey(d,m)  { return `time:${dateKey(d)}:${m}`; }
function weightKey(d)  { return `weight:${dateKey(d)}`; }
function exKey(d)      { return `exercise:${dateKey(d)}`; }
function isToday(d) {
  const t=nowKST();
  // 월/일만 비교 (연도 무관 - 다이어트 앱은 날짜 패턴 기준)
  return d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();
}
function formatDate(d) { return `${d.getMonth()+1}월 ${d.getDate()}일`; }

function calcStreak() {
  const today=nowKST(); today.setHours(0,0,0,0);
  let streak=0, check=new Date(today);
  if (!MEALS.some(m=>photoCache[`${dateKey(today)}:${m.key}`])) check.setDate(check.getDate()-1);
  const start=new Date(2025,1,27);
  while(check>=start) {
    const dk=dateKey(check);
    if(MEALS.some(m=>photoCache[`${dk}:${m.key}`])){ streak++; check.setDate(check.getDate()-1); } else break;
  }
  return streak;
}
function updateStreak() {
  const s=calcStreak(), el=document.getElementById('streakBadge');
  el.textContent=`🔥 ${s}일 연속`; el.className='streak-badge'+(s===0?' zero':'');
}
function getLastMealDateTime() {
  const dates=getDates(), now=nowKST();
  for(let i=dates.length-1;i>=0;i--) {
    const d=dates[i]; if(d>now) continue;
    for(let j=MEALS.length-1;j>=0;j--) {
      const t=timesCache[timeKey(d,MEALS[j].key)];
      if(t){ const[hh,mm]=t.split(':').map(Number); const dt=new Date(d); dt.setHours(hh,mm,0,0); if(dt<=now) return dt; }
    }
  }
  return null;
}
function updateFastingTimer() {
  const last=getLastMealDateTime(), el=document.getElementById('fastingTime');
  if(!last){ el.textContent='--'; return; }
  const diff=Math.floor((nowKST()-last)/1000);
  el.textContent=`${Math.floor(diff/3600)}h ${String(Math.floor((diff%3600)/60)).padStart(2,'0')}m`;
  document.getElementById('fastingBadge').title=`마지막 식사: ${last.getMonth()+1}/${last.getDate()} ${last.getHours()}:${String(last.getMinutes()).padStart(2,'0')}`;
}
function updateStats() {
  const total=Object.keys(photoCache).length, possible=getDates().length*3;
  document.getElementById('statCount').textContent=total;
  document.getElementById('statLabel').textContent=`/ ${possible} 끼`;
  document.getElementById('progressFill').style.width=`${(total/possible)*100}%`;
}
function showToast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2400);
}
function openLightbox(url,date,meal) {
  document.getElementById('lightboxImg').src=url;
  document.getElementById('lightboxMeta').innerHTML=`<span>${meal.emoji}</span><span>${formatDate(date)} ${meal.label}</span>`;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightboxImg').src='';
}
function updateDayStatus(dk,date) {
  const filled=MEALS.filter(m=>photoCache[`${dk}:${m.key}`]).length;
  const el=document.getElementById(`status-${dk}`); if(!el) return;
  el.textContent=filled===3?'✅ 3끼 완성!':filled>0?`${filled}/3 기록됨`:isToday(date)?'기록을 시작하세요':'기록 없음';
}


function toggleWeightPanel() {
  weightPanelOpen=!weightPanelOpen;
  document.getElementById('weightPanelBody').style.display=weightPanelOpen?'':'none';
  document.getElementById('weightPanelToggle').className='weight-panel-toggle'+(weightPanelOpen?' open':'');

function updateWeightMeta() {
  const vals=Object.entries(weightsCache).filter(([k])=>k.startsWith('weight:')).map(([,v])=>v).filter(v=>typeof v==='number');
  if(!vals.length){ document.getElementById('weightMeta').textContent='아직 기록 없음'; return; }
  const min=Math.min(...vals),max=Math.max(...vals),diff=(vals[vals.length-1]-vals[0]).toFixed(1);
  document.getElementById('weightMeta').textContent=`${min}~${max}kg · 변화 ${diff>0?'+':''}${diff}kg`;
}
function updateGoalBox() {
  const entries=getDates().map(d=>({wk:weightKey(d)})).filter(({wk})=>typeof weightsCache[wk]==='number').reverse();
  if(!entries.length){
    document.getElementById('goalCurrentVal').innerHTML='—<span class="goal-item-unit">kg</span>';
    document.getElementById('goalRemainingValue').textContent='체중을 입력해주세요';
    document.getElementById('goalBar').style.width='0%'; return;
  }
  const latest=weightsCache[entries[0].wk], first=weightsCache[entries[entries.length-1].wk];
  const rem=parseFloat((latest-GOAL_WEIGHT).toFixed(1));
  document.getElementById('goalCurrentVal').innerHTML=`${latest}<span class="goal-item-unit">kg</span>`;
  if(rem<=0){
    document.getElementById('goalRemainingValue').innerHTML='<span class="goal-reached">🏆 목표 달성! 축하해요!</span>';
    document.getElementById('goalBar').style.width='100%';
    document.getElementById('goalBar').style.background='linear-gradient(90deg,#FFD700,#FFA500)';
  } else {
    document.getElementById('goalRemainingValue').innerHTML=`<span style="color:#5DDB8A">▼ ${rem}kg</span> 더 빼면 목표 달성!`;
    const totalToLose=first-GOAL_WEIGHT;
    const pct=totalToLose>0?Math.min(100,Math.max(0,((first-latest)/totalToLose)*100)):0;
    document.getElementById('goalBar').style.width=pct.toFixed(1)+'%';
    document.getElementById('goalBar').style.background='linear-gradient(90deg,#2ECC71,#27AE60)';
  }
}
function drawWeightChart() {
  const canvas=document.getElementById('weightChart'); if(!canvas) return;
  const dpr=window.devicePixelRatio||1, W=canvas.offsetWidth||canvas.parentElement.offsetWidth||600, H=200;
  canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const PAD={l:48,r:16,t:16,b:32}, PW=W-PAD.l-PAD.r, PH=H-PAD.t-PAD.b;
  const dates=getDates(), points=[];
  dates.forEach((d,i)=>{ const w=weightsCache[weightKey(d)]; if(typeof w==='number') points.push({i,d,w}); });
  ctx.fillStyle='#F9F6F0'; ctx.roundRect(0,0,W,H,10); ctx.fill();
  if(!points.length){
    ctx.fillStyle='#B8A88A'; ctx.font='13px Noto Serif KR,serif'; ctx.textAlign='center';
    ctx.fillText('날짜별 체중을 입력하면 그래프가 표시됩니다',W/2,H/2); return;
  }
  const allW=points.map(p=>p.w), minW=Math.min(...allW)-1, maxW=Math.max(...allW)+1, wRange=maxW-minW||1;
  const xOf=i=>PAD.l+(i/(dates.length-1))*PW, yOf=w=>PAD.t+PH-((w-minW)/wRange)*PH;
  ctx.setLineDash([2,4]); ctx.strokeStyle='#E0D0B8'; ctx.lineWidth=1;
  for(let s=0;s<=4;s++){
    const w=minW+(wRange/4)*s, y=yOf(w);
    ctx.beginPath(); ctx.moveTo(PAD.l,y); ctx.lineTo(W-PAD.r,y); ctx.stroke();
    ctx.fillStyle='#9A8A70'; ctx.font='10px DM Serif Display,serif'; ctx.textAlign='right';
    ctx.fillText(w.toFixed(1),PAD.l-4,y+4);
  }
  ctx.setLineDash([]);
  ctx.fillStyle='#B8A88A'; ctx.font='10px Noto Serif KR,serif'; ctx.textAlign='center';
  dates.forEach((d,i)=>{ if(d.getDate()===1||i===0) ctx.fillText(`${d.getMonth()+1}월`,xOf(i),H-PAD.b+14); });
  if(points.length>1){
    const grad=ctx.createLinearGradient(0,PAD.t,0,PAD.t+PH);
    grad.addColorStop(0,'rgba(184,147,74,0.25)'); grad.addColorStop(1,'rgba(184,147,74,0.02)');
    ctx.beginPath(); ctx.moveTo(xOf(points[0].i),yOf(points[0].w));
    points.forEach(p=>ctx.lineTo(xOf(p.i),yOf(p.w)));
    ctx.lineTo(xOf(points[points.length-1].i),PAD.t+PH); ctx.lineTo(xOf(points[0].i),PAD.t+PH);
    ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
    ctx.beginPath(); ctx.moveTo(xOf(points[0].i),yOf(points[0].w));
    points.forEach(p=>ctx.lineTo(xOf(p.i),yOf(p.w)));
    ctx.strokeStyle='#B8934A'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
  }
  points.forEach(p=>{
    const x=xOf(p.i),y=yOf(p.w);
    ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#B8934A'; ctx.lineWidth=2.5; ctx.stroke();
    if(p===points[0]||p===points[points.length-1]){
      ctx.fillStyle='#5C4A30'; ctx.font='bold 10px DM Serif Display,serif'; ctx.textAlign='center';
      ctx.fillText(`${p.w}`,x,y-9);
    }
  });
}

function buildMealTimeRow(date,meal){
  const tk=timeKey(date,meal.key);
  const row=document.createElement('div'); row.className='meal-time-row';
  const btn=document.createElement('button'); btn.className='meal-time-btn';
  const clearBtn=document.createElement('button'); clearBtn.className='meal-time-clear'; clearBtn.innerHTML='&times;'; clearBtn.style.display='none';
  function parseTime(val){
    if(!val) return{ampm:'오전',h:null,m:null};
    const[hh,mm]=val.split(':').map(Number);
    return{ampm:hh<12?'오전':'오후',h:hh===0?12:hh>12?hh-12:hh,m:mm};
  }
  function to24h(ampm,h,m){ let hh=h; if(ampm==='오전'&&h===12)hh=0; else if(ampm==='오후'&&h!==12)hh=h+12; return`${String(hh).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
  function renderBtn(val){
    if(!val){ btn.innerHTML=`<span class="meal-time-btn-icon">⏰</span><span style="color:#C4B494;font-size:10px">시간 선택</span>`; btn.classList.remove('has-time'); clearBtn.style.display='none'; }
    else{ const{ampm,h,m}=parseTime(val); btn.innerHTML=`<span class="meal-time-btn-icon">⏰</span><span>${ampm} ${h}:${String(m).padStart(2,'0')}</span>`; btn.classList.add('has-time'); btn.style.borderColor=meal.color+'80'; clearBtn.style.display=''; }
  }
  renderBtn(timesCache[tk]||'');
  clearBtn.onclick=e=>{ e.stopPropagation(); timesCache[tk]=''; fbPut('times',tk,'').catch(console.error); renderBtn(''); updateFastingTimer(); };
  btn.onclick=e=>{
    e.stopPropagation(); if(activePickerClose) activePickerClose();
    const parsed=parseTime(timesCache[tk]||''); let selAmpm=parsed.ampm,selH=parsed.h,selM=parsed.m;
    const popup=document.createElement('div'); popup.className='time-picker-popup';
    const ampmRow=document.createElement('div'); ampmRow.className='tp-ampm';
    ['오전','오후'].forEach(ap=>{
      const b=document.createElement('button'); b.className='tp-ampm-btn'+(selAmpm===ap?' active':''); b.textContent=ap;
      b.onclick=()=>{ selAmpm=ap; ampmRow.querySelectorAll('.tp-ampm-btn').forEach(x=>x.classList.toggle('active',x.textContent===ap)); maybeSave(); };
      ampmRow.appendChild(b);
    });
    popup.appendChild(ampmRow);
    const hLabel=document.createElement('div'); hLabel.className='tp-section-label'; hLabel.textContent='시'; popup.appendChild(hLabel);
    const hGrid=document.createElement('div'); hGrid.className='tp-grid hours';
    for(let h=1;h<=12;h++){
      const c=document.createElement('div'); c.className='tp-cell'+(selH===h?' active':''); c.textContent=h;
      c.onclick=()=>{ selH=h; hGrid.querySelectorAll('.tp-cell').forEach((x,i)=>x.classList.toggle('active',i+1===h)); maybeSave(); };
      hGrid.appendChild(c);
    }
    popup.appendChild(hGrid);
    const mLabel=document.createElement('div'); mLabel.className='tp-section-label'; mLabel.textContent='분'; popup.appendChild(mLabel);
    const mGrid=document.createElement('div'); mGrid.className='tp-grid minutes';
    const minOpts=[0,5,10,15,20,25,30,35,40,45,50,55];
    minOpts.forEach(m=>{
      const c=document.createElement('div'); c.className='tp-cell'+(selM===m?' active':''); c.textContent=String(m).padStart(2,'0');
      c.onclick=()=>{ selM=m; mGrid.querySelectorAll('.tp-cell').forEach((x,i)=>x.classList.toggle('active',minOpts[i]===m)); maybeSave(); };
      mGrid.appendChild(c);
    });
    popup.appendChild(mGrid);
    function maybeSave(){ if(selH!==null&&selM!==null){ const val=to24h(selAmpm,selH,selM); timesCache[tk]=val; fbPut('times',tk,val).catch(console.error); renderBtn(val); updateFastingTimer(); } }
    function closePicker(){ if(popup.parentNode)popup.parentNode.removeChild(popup); activePickerClose=null; document.removeEventListener('click',outsideClick); }
    function outsideClick(e){ if(!popup.contains(e.target)&&e.target!==btn)closePicker(); }
    activePickerClose=closePicker; row.appendChild(popup);
    setTimeout(()=>document.addEventListener('click',outsideClick),0);
  };
  row.appendChild(btn); row.appendChild(clearBtn); return row;
}

function buildFoodNotes(date,meal){
  const nk=noteKey(date,meal.key);
  if(!notesCache[nk]||!Array.isArray(notesCache[nk])) notesCache[nk]=['','',''];
  const wrap=document.createElement('div'); wrap.className='food-notes'; wrap.id=`notes-wrap-${nk}`;
  function saveNotes(){ const inputs=wrap.querySelectorAll('.food-note-input'); notesCache[nk]=Array.from(inputs).map(i=>i.value); fbPut('notes',nk,notesCache[nk]).catch(console.error); }
  function renderRows(){
    wrap.innerHTML=''; const items=notesCache[nk];
    items.forEach((val,idx)=>{
      const row=document.createElement('div'); row.className='food-note-row';
      const input=document.createElement('input'); input.type='text'; input.className='food-note-input';
      input.value=val; input.maxLength=30; input.placeholder=idx===0?'음식 이름...':'추가...';
      input.addEventListener('blur',saveNotes);
      input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const all=wrap.querySelectorAll('.food-note-input'),cur=Array.from(all).indexOf(input); if(cur<all.length-1)all[cur+1].focus(); else if(items.length<MAX_NOTES){saveNotes();notesCache[nk].push('');renderRows();setTimeout(()=>{const u=wrap.querySelectorAll('.food-note-input');u[u.length-1].focus();},30);} } });
      row.appendChild(input);
      if(items.length>MIN_NOTES){ const del=document.createElement('button'); del.className='food-note-del'; del.innerHTML='&times;'; del.onclick=()=>{ saveNotes(); notesCache[nk].splice(idx,1); fbPut('notes',nk,notesCache[nk]).catch(console.error); renderRows(); }; row.appendChild(del); }
      wrap.appendChild(row);
    });
    if(items.length<MAX_NOTES){ const btn=document.createElement('button'); btn.className='food-add-btn'; btn.textContent=`+ 추가 (${items.length}/${MAX_NOTES})`; btn.onclick=()=>{ saveNotes(); notesCache[nk].push(''); renderRows(); setTimeout(()=>{const u=wrap.querySelectorAll('.food-note-input');u[u.length-1].focus();},30); }; wrap.appendChild(btn); }
    else{ const msg=document.createElement('div'); msg.className='food-limit-msg'; msg.textContent=`최대 ${MAX_NOTES}개`; wrap.appendChild(msg); }
  }
  renderRows(); return wrap;
}

function buildDayFooter(date){
  const wk=weightKey(date),ek=exKey(date);
  const wVal=weightsCache[wk],eVal=exerciseCache[ek]||{type:'',duration:''};
  const footer=document.createElement('div'); footer.className='day-footer';
  const wBlock=document.createElement('div'); wBlock.className='footer-block'; wBlock.innerHTML='<div class="footer-label">⚖️ 체중</div>';
  const wRow=document.createElement('div'); wRow.className='footer-input-row';
  const wInput=document.createElement('input'); wInput.type='number'; wInput.className='footer-input w-weight'; wInput.placeholder='00.0'; wInput.step='0.1'; wInput.min='20'; wInput.max='300'; wInput.value=wVal!=null?wVal:'';
  wInput.addEventListener('blur',()=>{ const v=parseFloat(wInput.value); if(!isNaN(v)&&v>=20){ weightsCache[wk]=v; fbPut('weights',wk,v).then(()=>{ drawWeightChart(); updateWeightMeta(); updateGoalBox(); document.getElementById('weightPanel').style.display=''; }).catch(console.error); } });
  const wUnit=document.createElement('span'); wUnit.className='footer-unit'; wUnit.textContent='kg';
  wRow.appendChild(wInput); wRow.appendChild(wUnit); wBlock.appendChild(wRow); footer.appendChild(wBlock);
  const eBlock=document.createElement('div'); eBlock.className='footer-block'; eBlock.innerHTML='<div class="footer-label">💪 운동</div>';
  const eRow=document.createElement('div'); eRow.className='footer-input-row';
  const eType=document.createElement('input'); eType.type='text'; eType.className='footer-input w-exercise-type'; eType.placeholder='운동 종류 (예: 걷기)'; eType.value=eVal.type||''; eType.maxLength=20;
  const eDur=document.createElement('input'); eDur.type='number'; eDur.className='footer-input w-exercise-dur'; eDur.placeholder='0'; eDur.min='0'; eDur.max='600'; eDur.value=eVal.duration||'';
  const eUnit=document.createElement('span'); eUnit.className='footer-unit'; eUnit.textContent='분';
  function saveEx(){ exerciseCache[ek]={type:eType.value.trim(),duration:eDur.value}; fbPut('exercise',ek,exerciseCache[ek]).catch(console.error); }
  eType.addEventListener('blur',saveEx); eDur.addEventListener('blur',saveEx);
  eRow.appendChild(eType); eRow.appendChild(eDur); eRow.appendChild(eUnit); eBlock.appendChild(eRow); footer.appendChild(eBlock);
  return footer;
}

function triggerUpload(date, meal) {
  currentUpload = { date, meal };
  document.getElementById('fileInput').click();
}

// ── 이미지 압축 (canvas) ──
function compressImage(file, maxWidth=1200, quality=0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        // 용량이 700KB 이하 될 때까지 quality 줄이기
        let q = quality;
        let dataUrl = canvas.toDataURL('image/jpeg', q);
        while (dataUrl.length > 700000 && q > 0.3) {
          q -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', q);
        }
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('fileInput').addEventListener('change', async function(e) {
  const file = e.target.files[0]; if(!file||!currentUpload) return;
  const{date,meal}=currentUpload; const pk=photoKey(date,meal.key), dk=dateKey(date);
  const wrapper=document.getElementById(`slot-${pk}`);
  if(wrapper){ wrapper.innerHTML=''; wrapper.appendChild(createUploadingSlot(meal)); }
  try {
    showToast('🔄 사진 압축 중...');
    const dataUrl = await compressImage(file);
    await fbPut('photos', pk, dataUrl);
    photoCache[pk] = dataUrl;
    if(wrapper){ wrapper.innerHTML=''; wrapper.appendChild(createPhotoSlot(dataUrl,date,meal)); }
    updateDayStatus(dk,date); updateStats(); updateStreak();
    showToast('✅ 사진이 저장되었습니다!');
  } catch(err){
    console.error(err);
    if(wrapper){ wrapper.innerHTML=''; wrapper.appendChild(createEmptySlot(date,meal)); }
    showToast('❌ 저장 실패. 다시 시도해주세요.');
  }
  this.value='';
});

function render(dates){
  const main=document.getElementById('mainContent'); main.innerHTML='';
  const months={};
  dates.forEach(d=>{ const mk=`${d.getFullYear()}-${d.getMonth()}`; if(!months[mk])months[mk]={label:`${d.getMonth()+1}월`,dates:[]}; months[mk].dates.push(d); });
  Object.values(months).forEach(({label,dates:mDates})=>{
    const sec=document.createElement('section'); sec.className='month-section';
    sec.innerHTML=`<div class="month-header"><h2 class="month-title">${label}</h2><div class="month-line"></div></div>`;
    mDates.forEach(date=>{
      const today=isToday(date),dk=dateKey(date);
      const filled=MEALS.filter(m=>photoCache[`${dk}:${m.key}`]).length;
      const statusText=filled===3?'✅ 3끼 완성!':filled>0?`${filled}/3 기록됨`:today?'기록을 시작하세요':'기록 없음';
      const card=document.createElement('div'); card.className=`day-card${today?' today':''}`;
      const header=document.createElement('div'); header.className='day-header';
      header.innerHTML=`<div class="day-badge"><div class="day-dow">${DOW[date.getDay()]}</div></div><div class="day-info"><div class="day-info-title">${date.getDate()}일${today?'<span class="today-badge">오늘</span>':''}</div><div class="day-status" id="status-${dk}">${statusText}</div></div>`;
      card.appendChild(header);
      const grid=document.createElement('div'); grid.className='meal-grid'; grid.id=`grid-${dk}`;
      MEALS.forEach(meal=>{
        const col=document.createElement('div'), inner=document.createElement('div'); inner.className='meal-col-inner';
        const lbl=document.createElement('div'); lbl.className='meal-label'; lbl.innerHTML=`<span>${meal.emoji}</span><span style="color:${meal.color};font-size:8px">●</span><span style="color:${meal.color};font-weight:700">${meal.label}</span>`;
        inner.appendChild(lbl); inner.appendChild(buildMealTimeRow(date,meal));
        const pk=`${dk}:${meal.key}`, sw=document.createElement('div'); sw.id=`slot-${pk}`;
        sw.appendChild(photoCache[pk]?createPhotoSlot(photoCache[pk],date,meal):createEmptySlot(date,meal));
        inner.appendChild(sw); inner.appendChild(buildFoodNotes(date,meal));
        col.appendChild(inner); grid.appendChild(col);
      });
      card.appendChild(grid);
      // ── finish-row ──
      const finishRow = document.createElement('div');
      finishRow.className = 'finish-row';

      const doneBadge = document.createElement('div');
      doneBadge.className = 'done-badge';
      doneBadge.innerHTML = '✅ 기록 완료';

      const editBtn = document.createElement('button');
      editBtn.className = 'edit-btn'; editBtn.textContent = '✏️ 수정';
      editBtn.onclick = async () => {
        card.classList.remove('done');
        await fbPut('notes', `${dk}:done`, 'false');
      };
      doneBadge.appendChild(editBtn);

      const finishBtn = document.createElement('button');
      finishBtn.className = 'finish-btn'; finishBtn.textContent = '✅ 기록 완료';
      finishBtn.onclick = async () => {
        card.classList.add('done');
        await fbPut('notes', `${dk}:done`, 'true');
      };

      finishRow.appendChild(doneBadge);
      finishRow.appendChild(finishBtn);

      card.appendChild(buildDayFooter(date));
      card.appendChild(finishRow);

      // 상태 적용 — 접기 없음, 모두 펼쳐진 상태
      const isDone = notesCache[`${dk}:done`] === 'true';
      if(isDone) card.classList.add('done');

      sec.appendChild(card);
    });
    main.appendChild(sec);
  });
  const todayCard=document.querySelector('.day-card.today');
  if(todayCard) setTimeout(()=>todayCard.scrollIntoView({behavior:'smooth',block:'start'}),400);
}

async function loadAndRender(){
  document.getElementById('loadingScreen').style.display='';
  document.getElementById('mainContent').style.display='none';
  try {
    [photoCache,notesCache,timesCache,weightsCache,exerciseCache]=await Promise.all([
      fbGetAll('photos'),fbGetAll('notes'),fbGetAll('times'),fbGetAll('weights'),fbGetAll('exercise')
    ]);
  } catch(e){ console.error('데이터 로드 실패:',e); showToast('❌ 데이터 로드 실패. 네트워크를 확인해주세요.'); }
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('mainContent').style.display='';
  document.getElementById('weightPanel').style.display='';
  render(getDates()); updateStats(); updateStreak(); updateFastingTimer(); updateWeightMeta(); updateGoalBox(); 
  setTimeout(()=>drawWeightChart(),100);
  if(fastingInterval) clearInterval(fastingInterval);
  fastingInterval=setInterval(updateFastingTimer,60000);
  window.addEventListener('resize',()=>setTimeout(drawWeightChart,100));
}
